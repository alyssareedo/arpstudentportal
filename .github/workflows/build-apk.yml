# Builds a test (debug) APK on GitHub's servers. No Android Studio needed.
# Run it: GitHub repo -> Actions -> "Build test APK" -> Run workflow.
# Download it: open the finished run -> Artifacts -> arp-test-apk.
name: Build test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "android/**", "capacitor.config.ts", "package.json", ".env.native"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - name: Release safety check
        run: npm run check:release
      - name: Build web app (uses your own database)
        run: npm run build:native
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: arp-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
